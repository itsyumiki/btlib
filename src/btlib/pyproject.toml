[project]
name = "pybtlib"
version = "0.0.3"
description = "A cross-platform Bluetooth library for Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "btlib-core",
  "btlib-macos; sys_platform == 'darwin'",
  "btlib-windows; sys_platform == 'win32'",
  "btlib-linux; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btlib"]

[tool.uv.sources]
btlib-core = { workspace = true }
btlib-windows = { workspace = true }
btlib-macos = { workspace = true }
btlib-linux = { workspace = true }
